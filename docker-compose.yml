services:
  watchop:
    build: .
    container_name: watchop-store
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/watchop.db
      - UPLOADS_DIR=/data/uploads
      - BACKUP_DIR=/data/backups
    volumes:
      - watchop_data:/data

volumes:
  watchop_data:
